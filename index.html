<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog App</title>
  <link rel="icon" type="image/png" href="blog-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-picture" style="background-image: url('laptop-with-envelope-spiral-notepad-pencils-stationeries-gray-backdrop.jpg'); background-size: cover; background-attachment: fixed;">
  <div class="container py-4">
    <nav class="navbar navbar-expand-lg mb-4 shadow rounded" style="background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);">
        <div class="container-fluid p-0" style="height: 90px; overflow: hidden; background: transparent;">
            <div class="w-100 d-flex align-items-center justify-content-between position-relative px-3">
                <h1 class="mb-0 py-3 px-4 text-white fw-bold shadow-lg" style="background: rgba(30,30,60,0.55); border-radius: 12px; font-size: 2.3rem; z-index: 2; position: relative; letter-spacing: 2px;">
                    <span style="font-size:2.1rem; vertical-align:middle;">📖</span> My Blog
                </h1>
                <!-- ✅ History Button -->
                <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#historyModal">History</button>
            </div>
        </div>
    </nav>

    <!-- Input form -->
    <div class="card shadow-sm p-3 mb-4">
      <div class="mb-3">
        <input type="text" id="title-input" class="form-control" placeholder="Enter Blog Title">
      </div>
      <div class="mb-3">
        <textarea id="content-input" class="form-control" placeholder="Write your blog post..." rows="3"></textarea>
      </div>
      <button id="add-post" class="btn btn-primary w-100">Add Blog</button>
    </div>

    <!-- Post list -->
    <h2 class="mb-3">All Blog Posts</h2>
    <div id="post-list" class="d-flex flex-column gap-3"></div>
  </div>

  <!-- ✅ History Modal -->
  <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="historyLabel">Deleted Blog History</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="history-list" class="list-group"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ✅ State object
    const state = {
      posts: [],
      editingIndex: null,
      history: [] // store deleted posts (will be persisted)
    };

    // ---------- new helper: localStorage persistence for history ----------
    const HISTORY_KEY = "blog_history_v1"; // key used in localStorage
    const KEEP_MS = 10 * 24 * 60 * 60 * 1000; // 10 days in ms

    function saveHistoryToLocal() {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history));
      } catch (e) {
        // if storage fails, silently ignore (quota, private mode, etc.)
      }
    }

    function loadHistoryFromLocal() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (!raw) {
          state.history = [];
          return;
        }
        const arr = JSON.parse(raw);
        const now = Date.now();
        // keep only items deleted within KEEP_MS window
        const filtered = (arr || []).filter(item => {
          // prefer ISO timestamp if present, otherwise try to parse display string
          const ts = item.deletedAtISO ? Date.parse(item.deletedAtISO) : Date.parse(item.deletedAt);
          if (!ts || isNaN(ts)) return false;
          return (now - ts) <= KEEP_MS;
        });
        state.history = filtered;
        // save back to cleanup expired ones
        saveHistoryToLocal();
      } catch (e) {
        state.history = [];
      }
    }

    // ---------- render posts ----------
    function renderPosts() {
      const container = document.getElementById("post-list");
      container.innerHTML = "";

      state.posts.forEach((post, index) => {
        const card = document.createElement("div");
        card.className = "card shadow-sm";

        const cardBody = document.createElement("div");
        cardBody.className = "card-body";

        if (state.editingIndex === index) {
          // Edit mode
          const titleInput = document.createElement("input");
          titleInput.type = "text";
          titleInput.className = "form-control mb-2";
          titleInput.value = post.title;

          const contentInput = document.createElement("textarea");
          contentInput.className = "form-control mb-2";
          contentInput.value = post.content;

          const updateBtn = document.createElement("button");
          updateBtn.className = "btn btn-success btn-sm me-2";
          updateBtn.textContent = "Update";
          updateBtn.addEventListener("click", () => {
            const newTitle = titleInput.value.trim();
            const newContent = contentInput.value.trim();
            if (newTitle && newContent) {
              state.posts[index] = { ...state.posts[index], title: newTitle, content: newContent };
              state.editingIndex = null;
              renderPosts();
            }
          });

          const cancelBtn = document.createElement("button");
          cancelBtn.className = "btn btn-secondary btn-sm";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => {
            state.editingIndex = null;
            renderPosts();
          });

          cardBody.appendChild(titleInput);
          cardBody.appendChild(contentInput);
          cardBody.appendChild(updateBtn);
          cardBody.appendChild(cancelBtn);
        } else {
          // View mode
          const title = document.createElement("h5");
          title.className = "card-title";
          title.textContent = post.title;

          const content = document.createElement("p");
          content.className = "card-text";
          content.textContent = post.content;

          // ✅ Show created date (if present)
          const createdAt = document.createElement("small");
          createdAt.className = "text-muted d-block mb-2";
          createdAt.textContent = `Posted on: ${post.createdAt || ""}`;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "btn btn-danger btn-sm me-2";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => {
            // store original index so we can restore to the same place
            state.history.push({
              ...state.posts[index],
              deletedAt: new Date().toLocaleString(),
              deletedAtISO: new Date().toISOString(),
              originalIndex: index
            });
            saveHistoryToLocal(); // persist history
            state.posts.splice(index, 1);
            if (state.editingIndex === index) state.editingIndex = null;
            renderPosts();
            // keep history display current if modal open
            renderHistory();
          });

          const editBtn = document.createElement("button");
          editBtn.className = "btn btn-warning btn-sm";
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", () => {
            state.editingIndex = index;
            renderPosts();
          });

          cardBody.appendChild(title);
          cardBody.appendChild(content);
          cardBody.appendChild(createdAt);
          cardBody.appendChild(deleteBtn);
          cardBody.appendChild(editBtn);
        }

        card.appendChild(cardBody);
        container.appendChild(card);
      });
    }

    // ---------- render history (with Restore) ----------
    function renderHistory() {
      const historyContainer = document.getElementById("history-list");
      historyContainer.innerHTML = "";

      // Clean expired entries on each render
      const now = Date.now();
      state.history = state.history.filter(item => {
        const ts = item.deletedAtISO ? Date.parse(item.deletedAtISO) : Date.parse(item.deletedAt);
        return ts && !isNaN(ts) && (now - ts) <= KEEP_MS;
      });
      saveHistoryToLocal();

      if (state.history.length === 0) {
        historyContainer.innerHTML = "<p class='text-muted'>No deleted blogs yet.</p>";
        return;
      }

      state.history.forEach((post, idx) => {
        const item = document.createElement("div");
        item.className = "list-group-item d-flex flex-column";

        const title = document.createElement("h6");
        title.textContent = post.title;

        const p = document.createElement("p");
        p.textContent = post.content;

        const meta = document.createElement("small");
        const deletedLabel = post.deletedAt || (post.deletedAtISO ? new Date(post.deletedAtISO).toLocaleString() : "");
        meta.className = "text-muted";
        meta.innerHTML = `Posted on: ${post.createdAt || ""} <br> Deleted at: ${deletedLabel}`;

        const controls = document.createElement("div");
        controls.className = "mt-2";

        // Restore button
        const restoreBtn = document.createElement("button");
        restoreBtn.className = "btn btn-success btn-sm me-2";
        restoreBtn.textContent = "Restore";
        restoreBtn.addEventListener("click", () => {
          // Insert back at original index if possible
          const orig = Number.isFinite(post.originalIndex) ? post.originalIndex : null;
          const restored = { title: post.title, content: post.content, createdAt: post.createdAt };

          if (orig !== null && orig <= state.posts.length) {
            // if original index available and within bounds, insert there
            state.posts.splice(orig, 0, restored);
          } else {
            // otherwise append at end
            state.posts.push(restored);
          }

          // remove from history and persist
          state.history.splice(idx, 1);
          saveHistoryToLocal();

          // re-render both lists
          renderPosts();
          renderHistory();
        });

        // Optionally: Permanent delete button (if you want)
        const permDelBtn = document.createElement("button");
        permDelBtn.className = "btn btn-outline-danger btn-sm";
        permDelBtn.textContent = "Delete Permanently";
        permDelBtn.addEventListener("click", () => {
          state.history.splice(idx, 1);
          saveHistoryToLocal();
          renderHistory();
        });

        controls.appendChild(restoreBtn);
        controls.appendChild(permDelBtn);

        item.appendChild(title);
        item.appendChild(p);
        item.appendChild(meta);
        item.appendChild(controls);

        historyContainer.appendChild(item);
      });
    }

    // ---------- Add new post ----------
    document.getElementById("add-post").addEventListener("click", () => {
      const titleInput = document.getElementById("title-input");
      const contentInput = document.getElementById("content-input");

      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (title && content) {
        state.posts.push({ title, content, createdAt: new Date().toLocaleString() });
        titleInput.value = "";
        contentInput.value = "";
        renderPosts();
      }
    });

    // ---------- hook modal show to render history live ----------
    const historyModalEl = document.getElementById("historyModal");
    if (historyModalEl) {
      historyModalEl.addEventListener("show.bs.modal", () => {
        // ensure we load/purge expired items right before showing
        loadHistoryFromLocal();
        renderHistory();
      });
    }

    // ---------- load history from localStorage on startup ----------
    loadHistoryFromLocal();

    // ---------- Initial render ----------
    renderPosts();
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
